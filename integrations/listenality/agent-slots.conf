# Listenality adapter. Copy to the project root as .agent-slots.conf before adoption.
# Credentials stay in apps/web/.env; runtime configuration contains no secrets.
# Sourced configuration exports its variables to the runtime functions. Its callers set -Eeuo
# pipefail; standalone cd statements retain the caller's rollback trap on setup failure.
# shellcheck disable=SC2034,SC2164
AGENT_MAIN_BRANCH=main
AGENT_PROJECT_SLUG=music_analytics
AGENT_DATABASE_MAIN=music_analytics_dev
AGENT_DATABASE_PREFIX=music_analytics_a
AGENT_PG_USER=tracker
AGENT_WORKTREE_PREFIX=ma-
AGENT_APP_DIR=apps/web
AGENT_MOBILE_DIR=apps/mobile
AGENT_ENV_FILE=.env
AGENT_CONFLICT_ENV_FILE=.env.local
AGENT_WEB_PORT_BASE=3000
AGENT_METRO_PORT_BASE=8081
AGENT_PORT_STEP=100
AGENT_SLOT_MAX=9
AGENT_SLOT_KEY=AGENT_SLOT
AGENT_DATABASE_URL_KEY=DATABASE_URL
AGENT_QUEUE_SCHEMA_KEY=PGBOSS_SCHEMA
AGENT_QUEUE_SCHEMA_MAIN=pgboss
AGENT_QUEUE_SCHEMA_PREFIX=pgboss_a
AGENT_INHERITED_QUEUE_SCHEMA=pgboss
AGENT_PUBLIC_URL_KEY=NEXT_PUBLIC_APP_URL
AGENT_PUBLIC_URL_FORMAT='http://localhost:%s'
AGENT_TEST_COMMAND='npm test'

agent_prepare_worktree() {
  local main="$1" wt="$2"
  agent_clone_node_modules "$main" "$wt"
  (
    cd "$wt/$AGENT_APP_DIR"
    npx prisma generate >/dev/null
  )
}

agent_start_web() {
  local wt="$1" port="$2"
  shift 2
  cd "$wt/$AGENT_APP_DIR"
  exec npx next dev -p "$port" "$@"
}

agent_start_mobile() {
  local wt="$1" port="$2"
  shift 2
  cd "$wt/$AGENT_MOBILE_DIR"
  exec npx expo start --port "$port" "$@"
}

agent_dependencies_stale() { agent_node_modules_stale "$1"; }

# Provider callbacks remain registered on slot 0, as in the existing project loop.
agent_after_slot_env() {
  if grep -qE '^(SPOTIFY_REDIRECT_URI|GOOGLE_REDIRECT_URI)=.*:3000' "$1"; then
    echo 'agent-up: provider sign-in callbacks use port 3000; test sign-in on slot 0.'
  fi
}
